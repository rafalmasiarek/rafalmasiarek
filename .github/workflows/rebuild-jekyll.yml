name: Trigger rafalmasiarek.github.io deploy

on:
  push:
    branches: [ main ]
    paths:
      - README.md

  pull_request:
    branches: [ main ]
    paths:
      - README.md

  workflow_dispatch:

jobs:
  trigger-pages-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deploy in rafalmasiarek.github.io
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAGES_REPO_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/rafalmasiarek/rafalmasiarek.github.io/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"master"}'
