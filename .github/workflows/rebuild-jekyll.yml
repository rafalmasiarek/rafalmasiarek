name: Trigger rafalmasiarek.github.io deploy

on:
  push:
    branches: [ main ]
    paths:
      - README.md

  pull_request:
    branches: [ main ]
    paths:
      - README.md

  workflow_dispatch:

jobs:
  trigger-pages-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Skip deploy on pull request
        if: github.event_name == 'pull_request'
        run: echo "Pull request detected. Skipping external deploy dispatch."

      - name: Trigger deploy in rafalmasiarek.github.io
        if: github.event_name != 'pull_request'
        env:
          PAGES_REPO_TOKEN: ${{ secrets.PAGES_REPO_TOKEN }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"

          status_code="$(
            curl -sS -L \
              -o "$response_file" \
              -w "%{http_code}" \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${PAGES_REPO_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/rafalmasiarek/rafalmasiarek.github.io/actions/workflows/deploy.yml/dispatches \
              -d '{"ref":"master"}'
          )"

          echo "GitHub API status: ${status_code}"
          cat "$response_file"

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            exit 1
          fi

          echo "Deploy workflow dispatch request sent."
